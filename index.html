<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Tienda Premium Sangolquí</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-[#F4F7F9] text-[#1A1A1A] font-['Plus_Jakarta_Sans'] antialiased overflow-x-hidden">

    <!-- Header Estilo Amazon Premium Mobile Optimized -->
    <header class="bg-[#0F1111] text-white sticky top-0 z-[100] shadow-2xl">
        <div class="max-w-[1600px] mx-auto px-4">
            <!-- Top Header -->
            <div class="h-16 md:h-20 flex items-center justify-between gap-2 md:gap-6">
                <!-- Logo -->
                <div class="flex items-center cursor-pointer group" onclick="window.location.reload()">
                    <div class="bg-[#FFD814] text-black font-black px-2 py-0.5 rounded text-lg md:text-xl mr-1 transform group-hover:rotate-12 transition-transform">A</div>
                    <span class="text-xl md:text-2xl font-extrabold tracking-tighter">AURA</span>
                </div>

                <!-- Search Bar (Desktop) -->
                <div class="hidden md:flex flex-1 h-11 max-w-3xl">
                    <div class="relative w-full flex group">
                        <select id="category-filter-desktop" class="bg-zinc-100 text-zinc-700 px-4 rounded-l-md text-xs border-r border-zinc-300 focus:outline-none hover:bg-zinc-200 cursor-pointer font-bold">
                            <option value="all">Todos</option>
                            <option value="Tecnología">Tecnología</option>
                            <option value="Hogar">Hogar</option>
                            <option value="Cocina">Cocina</option>
                            <option value="Deportes">Deportes</option>
                            <option value="Oficina">Oficina</option>
                            <option value="Accesorios">Accesorios</option>
                        </select>
                        <input type="text" id="search-input-desktop" placeholder="Busca entre 100 productos premium..." class="w-full px-4 text-black focus:outline-none text-sm">
                        <button class="bg-[#FFD814] hover:bg-[#F7CA00] text-[#0F1111] px-6 rounded-r-md transition-colors">
                            <i data-lucide="search" class="w-6 h-6"></i>
                        </button>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex items-center gap-2 md:gap-4">
                    <div class="hidden lg:flex flex-col cursor-pointer border border-transparent hover:border-white p-2 rounded-sm">
                        <span class="text-[11px] text-zinc-400 leading-none">Hola, Identifícate</span>
                        <span class="text-sm font-bold leading-none">Cuenta</span>
                    </div>
                    
                    <button id="cart-toggle" class="relative flex items-center gap-1 px-2 py-2 border border-transparent hover:border-white rounded-sm transition-all">
                        <div class="relative">
                            <i data-lucide="shopping-cart" class="w-7 h-7 md:w-8 md:h-8"></i>
                            <span id="cart-count" class="absolute -top-1 -right-1 bg-[#FFD814] text-black text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-[#0F1111]">0</span>
                        </div>
                        <span class="font-bold text-sm hidden sm:inline mt-2 uppercase tracking-tighter">Cesta</span>
                    </button>
                </div>
            </div>

            <!-- Search Bar (Mobile) -->
            <div class="md:hidden pb-3">
                <div class="flex h-10 w-full group">
                    <input type="text" id="search-input-mobile" placeholder="Buscar en AURA..." class="w-full px-4 rounded-l-md text-black focus:outline-none text-sm">
                    <button class="bg-[#FFD814] text-[#0F1111] px-4 rounded-r-md">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Sub Nav (Horizontal Scrollable) -->
        <nav class="bg-[#232f3e] text-white text-xs md:text-sm font-medium py-2 overflow-x-auto no-scrollbar border-t border-white/10">
            <div class="max-w-[1600px] mx-auto px-4 flex items-center gap-4 md:gap-6 whitespace-nowrap">
                <button class="flex items-center gap-1 font-bold hover:outline hover:outline-1 outline-white px-2 py-1">
                    <i data-lucide="menu" class="w-4 h-4 md:w-5 md:h-5"></i> Todo
                </button>
                <a href="#" class="hover:outline hover:outline-1 outline-white px-2 py-1">Ofertas</a>
                <a href="#" class="hover:outline hover:outline-1 outline-white px-2 py-1">Tecnología</a>
                <a href="#" class="hover:outline hover:outline-1 outline-white px-2 py-1">Hogar</a>
                <a href="#" class="hover:outline hover:outline-1 outline-white px-2 py-1">Deportes</a>
                <a href="#" class="text-[#FFD814] font-bold hover:underline">AURA PRIME</a>
            </div>
        </nav>
    </header>

    <main>
        <!-- Hero Section Optimized for Mobile -->
        <section class="relative h-[250px] md:h-[400px] overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#F4F7F9] z-10"></div>
            <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=2000&q=80" class="w-full h-full object-cover">
            <div class="absolute inset-0 flex items-center z-20 max-w-[1600px] mx-auto px-4">
                <div class="max-w-xs md:max-w-xl bg-white/10 backdrop-blur-md p-4 md:p-8 rounded-2xl border border-white/20 shadow-2xl">
                    <h1 class="text-2xl md:text-5xl font-black text-white mb-2 md:mb-4 leading-tight">Vive la experiencia <span class="text-[#FFD814]">AURA</span></h1>
                    <p class="text-white/90 text-sm md:text-lg mb-4 md:mb-8">Entrega inmediata en Sangolquí.</p>
                    <button class="bg-[#FFD814] text-black px-6 md:px-8 py-2 md:py-3 rounded-full font-bold text-sm md:text-lg hover:bg-white transition-all transform hover:scale-105 shadow-xl">
                        Ver Ofertas
                    </button>
                </div>
            </div>
        </section>

        <!-- Product Grid Responsive -->
        <div class="max-w-[1600px] mx-auto px-2 md:px-4 -mt-10 md:-mt-20 relative z-30 mb-20">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2 md:gap-6">
                <!-- Productos inyectados dinámicamente -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#232f3e] text-white py-10 md:py-12">
        <div class="max-w-[1600px] mx-auto px-4 text-center">
            <div class="flex justify-center items-center gap-2 mb-4">
                <div class="bg-[#FFD814] text-black font-black px-2 py-0.5 rounded text-lg">A</div>
                <span class="text-xl font-extrabold tracking-tighter">AURA</span>
            </div>
            <p class="text-zinc-400 text-xs md:text-sm mb-6 max-w-md mx-auto">Tu tienda premium en Sangolquí.</p>
            <div class="mt-8 pt-8 border-t border-zinc-700 text-zinc-500 text-[10px] md:text-xs">
                © 2024 AURA Corporation S.A. | Sangolquí, Ecuador.
            </div>
        </div>
    </footer>

    <!-- Sidebar Carrito Mobile Friendly -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-[450px] bg-white shadow-[-20px_0_50px_rgba(0,0,0,0.2)] z-[110] transform translate-x-full transition-transform duration-500 ease-in-out">
        <div class="flex flex-col h-full">
            <div class="p-4 md:p-6 border-b flex justify-between items-center bg-[#0F1111] text-white">
                <div class="flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="text-[#FFD814]"></i>
                    <h3 class="text-lg md:text-xl font-bold">Tu Cesta</h3>
                </div>
                <button id="cart-close" class="p-2 hover:bg-white/10 rounded-full transition-colors"><i data-lucide="x"></i></button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 bg-zinc-50"></div>
            <div class="p-4 md:p-6 bg-white border-t-2 border-zinc-100 space-y-4 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                <div class="space-y-1 md:space-y-2 text-sm md:text-base">
                    <div class="flex justify-between text-zinc-500"><span>Subtotal</span><span id="cart-subtotal" class="font-bold">$0.00</span></div>
                    <div class="flex justify-between text-zinc-500"><span>IVA (15%)</span><span id="cart-tax" class="font-bold">$0.00</span></div>
                    <div class="flex justify-between text-xl md:text-2xl pt-4 border-t mt-2">
                        <span class="font-extrabold">Total</span>
                        <span id="cart-total" class="font-black text-[#B12704]">$0.00</span>
                    </div>
                </div>
                <button id="checkout-btn" class="w-full bg-[#FFD814] hover:bg-[#F7CA00] text-black py-3 md:py-4 rounded-xl font-black shadow-lg flex items-center justify-center gap-3 transition-all active:scale-95 group">
                    <i data-lucide="file-check" class="w-5 h-5 md:w-6 md:h-6"></i> FINALIZAR COMPRA
                </button>
            </div>
        </div>
    </div>

    <!-- Quick View Modal Responsive -->
    <div id="quick-view-modal" class="fixed inset-0 z-[120] flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="bg-white w-full max-w-4xl max-h-[90vh] overflow-y-auto md:overflow-hidden rounded-3xl relative z-10 flex flex-col md:flex-row m-2 md:m-4 shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-20 text-zinc-400 hover:text-black bg-white/80 p-2 rounded-full md:bg-transparent"><i data-lucide="x" class="w-6 h-6 md:w-8 md:h-8"></i></button>
            <div class="w-full md:w-1/2 bg-zinc-100 p-6 md:p-12 flex items-center justify-center relative">
                <img id="modal-img" src="" alt="" class="max-w-full max-h-[250px] md:max-h-[400px] object-contain drop-shadow-2xl">
            </div>
            <div class="w-full md:w-1/2 p-6 md:p-12 flex flex-col">
                <span id="modal-cat" class="text-[10px] md:text-sm font-black text-orange-600 uppercase tracking-widest mb-2"></span>
                <h2 id="modal-name" class="text-xl md:text-3xl font-extrabold mb-4 md:mb-6 leading-tight"></h2>
                <p id="modal-desc" class="text-zinc-600 mb-6 md:mb-8 text-sm md:text-lg leading-relaxed"></p>
                <div class="mt-auto pt-4 md:pt-8 border-t flex items-center justify-between">
                    <span id="modal-price" class="text-2xl md:text-4xl font-black text-[#B12704]"></span>
                    <button id="modal-add-btn" class="bg-[#0F1111] text-white px-6 md:px-10 py-3 md:py-4 rounded-xl md:rounded-2xl font-black text-sm md:text-base hover:bg-zinc-800 transition-all shadow-xl active:scale-95">AÑADIR</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-20 md:bottom-12 left-1/2 -translate-x-1/2 z-[200] bg-[#0F1111] text-white px-6 md:px-8 py-3 md:py-4 rounded-2xl shadow-2xl flex items-center gap-4 opacity-0 pointer-events-none transition-all duration-500 scale-90 w-[90%] md:w-auto">
        <div class="bg-green-500 p-1 rounded-full">
            <i data-lucide="check" class="w-4 h-4 md:w-5 md:h-5 text-white"></i>
        </div>
        <span id="toast-msg" class="font-bold text-xs md:text-sm"></span>
    </div>

    <div id="overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[105] hidden"></div>

    <!-- Scripts -->
    <script src="products.js"></script>
    <script src="main.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
